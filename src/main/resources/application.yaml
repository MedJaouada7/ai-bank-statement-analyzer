spring:
  application:
    name: ai-bank-statement-analyzer
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                   
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:                                  # off by default, enabled per profile
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false