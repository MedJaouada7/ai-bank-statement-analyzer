services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: bsa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"                   
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.40.6
    container_name: bsa-ollama
    ports:
      - "11434:11434"         
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-pull:                 # one-shot init job: pulls the pinned models, then exits
    profiles: ["ollama"]
    image: ollama/ollama:0.40.6
    container_name: bsa-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_CHAT_MODEL_SMALL: ${OLLAMA_CHAT_MODEL_SMALL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for m in "$$OLLAMA_CHAT_MODEL" "$$OLLAMA_CHAT_MODEL_SMALL" "$$OLLAMA_EMBED_MODEL"; do
          echo "Pulling $$m"
          ollama pull "$$m"
        done

volumes:
  pgdata:
  ollama_data: